name: Instalar ambiente do cliente
on:
  workflow_dispatch:
    inputs:
      installation_name:
        description: 'Nome exclusivo do novo Worker e D1 (ex.: mesa-cliente-teste)'
        type: string
        required: true
      reuse_resources:
        description: 'Retomar/atualizar os recursos existentes DESTA instalação'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: install-client-${{ inputs.installation_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: npm run connector:pack
      - uses: actions/upload-artifact@v4
        with:
          name: saasagents-connector
          path: |
            dist/saasagents-connector-*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
  install:
    needs: validate
    runs-on: ubuntu-latest
    environment: client
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_KEY: ${{ secrets.SAASAGENTS_ADMIN_KEY }}
      INSTALLATION_NAME: ${{ inputs.installation_name }}
      REUSE_RESOURCES: ${{ inputs.reuse_resources }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirmar conta e preparar recursos exclusivos
        run: node scripts/client-install.mjs provision
      - name: Aplicar migrações somente no banco desta instalação
        run: npx wrangler d1 migrations apply "$INSTALLATION_NAME" --remote --config wrangler.client.json
      - name: Publicar painel, API e binding de IA
        run: npx wrangler deploy --config wrangler.client.json
      - name: Configurar código privado desta instalação
        run: printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY --config wrangler.client.json
      - name: Verificar integrações e gerar instruções para o servidor
        run: node scripts/client-install.mjs verify
