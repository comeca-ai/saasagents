name: Publicar SaaS Agents
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'connector/**'
      - 'migrations/**'
      - 'scripts/provision.mjs'
      - 'tests/**'
      - 'package*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saasagents-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: agents
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ID_CLOUDFLARE }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Validar acesso privado
        env:
          ADMIN_KEY: ${{ secrets.SAASAGENTS_ADMIN_KEY }}
        run: |
          if [ ${#ADMIN_KEY} -lt 24 ]; then
            echo 'Configure SAASAGENTS_ADMIN_KEY no environment agents (mínimo 24 caracteres).'
            exit 1
          fi
      - name: Preparar banco exclusivo do SaaS
        run: node scripts/provision.mjs
      - name: Aplicar migrações
        run: npx wrangler d1 migrations apply saasagents-v0 --remote --config wrangler.deploy.json
      - name: Publicar painel e API
        run: npx wrangler deploy --config wrangler.deploy.json
      - name: Configurar acesso privado
        env:
          ADMIN_KEY: ${{ secrets.SAASAGENTS_ADMIN_KEY }}
        run: printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY --config wrangler.deploy.json
