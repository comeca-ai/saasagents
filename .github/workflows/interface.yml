name: Interface de instalação

# Publica a página que guia o cliente (interface/) no GitHub Pages.
# Requer Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['interface/**', '.saasagents/**', '.github/workflows/agentes.yml', 'scripts/build-interface.mjs']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/actions.test.js
      - run: node scripts/build-interface.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: interface/dist
      - id: deploy
        uses: actions/deploy-pages@v4
